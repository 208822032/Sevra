services:
  tokenizer:
    image: tokenizer:local
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
    command: ["sh","-c","nuxt --port 3002 --module tokenizer.py --workers 2"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"role\":\"user\",\"content\":\"healthcheck\"}' --header='Content-Type: application/json' http://127.0.0.1:3002/tokenizer/deepseek-chat | grep -q '\"code\":200'"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
  keywords:
    image: keywords-filter:local
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    healthcheck:
      test: ["CMD","grpc_health_probe","-addr=:50051"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-keywords-conf
        target: /app/config.yaml
      - source: 2404-keywords-dict
        target: /app/dict.txt
  sensitive:
    image: keywords-filter:local
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: ["./keywords-filter"]
    command: ["--config=config.yaml","--dict=dict.txt"]
    healthcheck:
      test: [ "CMD","grpc_health_probe","-addr=:50051" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-sensitive-conf
        target: /app/config.yaml
      - source: 2404-sensitive-dict
        target: /app/dict.txt
  ai-chat-service:
    image: ai-chat-service:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tokenizer:
        condition: service_started
      keywords:
        condition: service_healthy
      sensitive:
        condition: service_healthy
      kvlite-vector:
        condition: service_healthy
      kvlite-session:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-service" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: [ "CMD","grpc_health_probe","-addr=:50055" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-ai-chat-service-conf
        target: /app/config.yaml
  ai-chat-backend:
    image: ai-chat-backend:local
    ports:
      - "7080:80"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-backend" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: [ "CMD","curl","http://localhost/api/health" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: 2404-ai-chat-backend-conf
        target: /app/config.yaml
  kvlite-vector:
    image: kvlite:local
    command: ["-c", "config/kvstore-embedding.conf"]
    ports:
      - "28080:28080"
    volumes:
      - kvlite-vector-data:/opt/kvlite/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/28080'"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
  kvlite-session:
    image: kvlite:local
    command: ["-c", "config/master.conf"]
    ports:
      - "9300:9300"
      - "9080:9080"
    volumes:
      - kvlite-session-data:/opt/kvlite/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9300'"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
volumes:
  kvlite-vector-data:
  kvlite-session-data:
configs:
  2404-keywords-conf:
    file: ./configs/keywords.yaml
  2404-keywords-dict:
    file: ./configs/keywords-dict.txt
  2404-sensitive-conf:
    file: ./configs/sensitive.yaml
  2404-sensitive-dict:
    file: ./configs/sensitive-dict.txt
  2404-ai-chat-service-conf:
    file: ./configs/ai-chat-service.yaml
  2404-ai-chat-backend-conf:
    file: ./configs/ai-chat-backend.yaml
