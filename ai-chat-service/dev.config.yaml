server:
  ip: 0.0.0.0
  port: 50055
  accessToken: "me256487ang1chubdpdialoud22sev1ozhoguumyqca"
log:
  # panic,fatal,error,warn,warning,info,debug,trace
  level: "info"
  logPath: "runtime/logs/app.log"
chat:
  # deepseek key
  api_key: "sk-626e29fcd5ad41a4a65e92ea54bf8faa"
  # deepseek 接口地址
  base_url: "https://api.deepseek.com/v1"
  # 使用的训练模型
  model: "deepseek-chat"
  # 单次请求的上下文总长度,包括：请求消息+响应消息
  max_tokens: 4096
  # 表示语言模型输出的随机性和创造性
  # 取值范围 0 ~ 1，值越大随机性越高
  temperature: 0.8
  # 用于生成文本时控制选词的随机程度
  # 即下一个预测单词考虑的概率范围
  # 取值范围0 ~ 1
  top_p: 0.9
  # 存在惩罚，用于生成文本时控制重复使用单词的程度
  # 取值范围 0 ~ 1 ，0表示不惩罚，1表示禁止重复
  presence_penalty: 0.8
  # 用于控制模型生成回复时重复单词出现的频率
  # 取值范围 0~1，值越大表示回复时会更注重避免使用已经出现的单词
  frequency_penalty: 0.5
  # AI助手特征描述
  bot_desc: "你是一个AI助手。回答时保持简洁、准确、中文优先。不要主动声称自己是 ChatGPT、OpenAI 或其他特定厂商的官方模型；如果用户询问你的身份，请说明你是当前应用中的 AI 助手。"
  # 单次请求，保留的响应tokens数量
  min_response_tokens: 2048
  # 上下文缓存时长，单位s
  context_ttl: 1800
  # 上下文消息条数
  context_len: 4
context:
  # redis | kvlite
  context_backend: "kvlite"
  # KVLite 不可用时是否回退到 Redis
  context_fallback_to_redis: true
  # 统一的上下文命名空间
  context_namespace: "ai:chat"
  kvlite:
    addr: "127.0.0.1:9300"
    password: ""
    timeout_ms: 2000
    connect_timeout_ms: 1000
    read_timeout_ms: 1000
    write_timeout_ms: 1000
    pool_size: 4
    max_idle: 2
    max_retries: 1
    retry_backoff_ms: 50
retrieval:
  semantic:
    # 语义兜底实验开关。默认关闭，打开后仍然保持 exact / normalized / alias / candidate 优先。
    enabled: false
    # brute-force 语义候选的 top-k 观察范围。
    top_k: 4
    # 语义命中阈值；越高越保守。
    threshold: 0.84
    # 限制每个 scope 内参与 brute-force 的语义候选数。
    corpus_limit: 128
    # 没有可用 embedding provider 时使用的占位模型名。
    embedding_model: "placeholder-hash-embedding"
    # 占位向量维度。
    embedding_dim: 64
    # 回答写回后是否异步补写 embedding。关闭后语义检索仍可读已存在的 embedding，但不会自动补写。
    async_backfill: true
