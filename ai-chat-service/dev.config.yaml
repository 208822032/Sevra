server:
  ip: 0.0.0.0
  port: 50055
  accessToken: "me256487ang1chubdpdialoud22sev1ozhoguumyqca"
log:
  # panic,fatal,error,warn,warning,info,debug,trace
  level: "info"
  logPath: "runtime/logs/app.log"
chat:
  # deepseek key
  api_key: "sk-626e29fcd5ad41a4a65e92ea54bf8faa"
  # deepseek 接口地址
  base_url: "https://api.deepseek.com/v1"
  # 使用的训练模型
  model: "deepseek-chat"
  # 单次请求的上下文总长度,包括：请求消息+响应消息
  max_tokens: 4096
  # 表示语言模型输出的随机性和创造性
  # 取值范围 0 ~ 1，值越大随机性越高
  temperature: 0.8
  # 用于生成文本时控制选词的随机程度
  # 即下一个预测单词考虑的概率范围
  # 取值范围0 ~ 1
  top_p: 0.9
  # 存在惩罚，用于生成文本时控制重复使用单词的程度
  # 取值范围 0 ~ 1 ，0表示不惩罚，1表示禁止重复
  presence_penalty: 0.8
  # 用于控制模型生成回复时重复单词出现的频率
  # 取值范围 0~1，值越大表示回复时会更注重避免使用已经出现的单词
  frequency_penalty: 0.5
  # AI助手特征描述
  bot_desc: "你是一个AI助手。回答时保持简洁、准确、中文优先。不要主动声称自己是 ChatGPT、OpenAI 或其他特定厂商的官方模型；如果用户询问你的身份，请说明你是当前应用中的 AI 助手。"
  # 单次请求，保留的响应tokens数量
  min_response_tokens: 2048
  # 上下文缓存时长，单位s
  context_ttl: 1800
  # 上下文消息条数
  context_len: 4
retrieval:
  kvlite:
    # 独立于 context.kvlite 的知识检索服务。
    enabled: true
    address: "127.0.0.1:28080"
    # 独立向量实例不可用时拒绝启动，避免无感退化为未检索聊天服务。
    startup_policy: "reject"
    # 当前路由只直返排名第一的命中；多于 1 的结果不参与选择。
    top_k: 1
    # 保守预校准保护值；必须由 cmd/kvlite-calibrate 的真实语料 holdout 结果替换。
    threshold: 0.75
    timeout_ms: 3000
    pool_size: 4
    max_idle: 2
    # API 未命中后，将成功回答异步直接写入知识 KVLite（开发测试开关）。
    auto_writeback: true
    scope:
      tenant: "local-dev"
      knowledge_base: "ai-chat"
      corpus_version: "v1"
context:
  # redis | kvlite
  context_backend: "kvlite"
  # KVLite 不可用时是否回退到 Redis
  context_fallback_to_redis: true
  # 统一的上下文命名空间
  context_namespace: "ai:chat"
  kvlite:
    addr: "127.0.0.1:9300"
    password: ""
    timeout_ms: 2000
    connect_timeout_ms: 1000
    read_timeout_ms: 1000
    write_timeout_ms: 1000
    pool_size: 4
    max_idle: 2
    max_retries: 1
    retry_backoff_ms: 50
redis:
  host: "127.0.0.1"
  port: 6379
  pwd: "123456"
mysql:
  dsn: "ai_chat:123456@tcp(127.0.0.1:3306)/ai_chat?collation=utf8mb4_unicode_ci&charset=utf8mb4"
  maxLifeTime: 3600
  maxOpenConn: 10
  maxIdleConn: 10
dependOn:
